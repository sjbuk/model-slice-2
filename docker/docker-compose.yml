services:
  meshpartition-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/app
    working_dir: /app
    command: ["pytest", "-v"]

  meshpartition-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/app
    working_dir: /app
    ports:
      - "5000:5000"
    command: ["python", "webapp/app.py"]
